# IP HASH: hash of the client IP decides the server -> "sticky sessions".
#
# Gotcha: for IPv4, Nginx hashes only the FIRST THREE OCTETS (e.g. 172.18.0.x).
# All requests from your machine come through Docker's gateway with one IP,
# so they ALL land on one server. In production, users behind the same NAT,
# mobile carrier or corporate proxy share an IP the same way -> hot spots.
upstream api_backend {
    zone api_backend 64k;
    ip_hash;

    server api1:3000 resolve max_fails=2 fail_timeout=10s;
    server api2:3000 resolve max_fails=2 fail_timeout=10s;
    server api3:3000 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;
}
