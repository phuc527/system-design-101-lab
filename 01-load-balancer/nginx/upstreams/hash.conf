# HASH BY USER (consistent hashing): the X-User-Id header decides the server.
# Same user -> same server, regardless of their IP (unlike ip_hash).
#
# `consistent` = ketama consistent hashing: when a server is added or removed,
# only ~1/N of users move to a different server, instead of almost all of them.
# (Lab 06 implements consistent hashing yourself.)
#
# Requests WITHOUT the header all hash the empty string -> one server gets them all.
upstream api_backend {
    zone api_backend 64k;
    hash $http_x_user_id consistent;

    server api1:3000 resolve max_fails=2 fail_timeout=10s;
    server api2:3000 resolve max_fails=2 fail_timeout=10s;
    server api3:3000 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;
}
