# WEIGHTED ROUND ROBIN: api1 gets 3 of every 5 requests (60%), api2 and api3 one each (20%).
# Use when servers have different sizes (a 4-CPU box next to 2-CPU boxes), or for
# canary releases: put the new version on a server with weight=1 out of 20 (5% of traffic).
upstream api_backend {
    zone api_backend 64k;

    server api1:3000 resolve weight=3 max_fails=2 fail_timeout=10s;
    server api2:3000 resolve weight=1 max_fails=2 fail_timeout=10s;
    server api3:3000 resolve weight=1 max_fails=2 fail_timeout=10s;

    keepalive 32;
}
