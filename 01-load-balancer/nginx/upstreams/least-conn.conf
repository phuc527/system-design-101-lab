# LEAST CONNECTIONS: send each request to the server with the fewest active
# connections (weighted by `weight`). Adapts when one server is slow:
# its requests pile up, so it receives fewer new ones.
upstream api_backend {
    zone api_backend 64k;
    least_conn;

    server api1:3000 resolve max_fails=2 fail_timeout=10s;
    server api2:3000 resolve max_fails=2 fail_timeout=10s;
    server api3:3000 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;
}
