# ROUND ROBIN (Nginx default - no directive needed): api1, api2, api3, api1, ...
#
# zone       : shared memory so all Nginx worker processes share one view of the
#              upstream (round-robin position, failure counts). Required by `resolve`.
# resolve    : re-resolve the hostname via the `resolver` (every 5s). When a container
#              stops, Docker DNS drops its name and Nginx removes it from rotation;
#              when it starts again, Nginx adds it back. (Open-source since 1.27.3.)
# max_fails / fail_timeout : PASSIVE health check. 2 failed requests within 10s
#              -> server is skipped for 10s, then tried again with real traffic.
# keepalive  : up to 32 idle connections per worker kept open to the backends.
upstream api_backend {
    zone api_backend 64k;

    server api1:3000 resolve max_fails=2 fail_timeout=10s;
    server api2:3000 resolve max_fails=2 fail_timeout=10s;
    server api3:3000 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;
}
