# Main Nginx config (replaces the image's /etc/nginx/nginx.conf).
# The interesting part - upstreams and proxy settings - is in templates/default.conf.template.

# One worker process per CPU core. Each worker is single-threaded and event-driven
# (just like Node.js), and can handle thousands of connections.
worker_processes auto;

error_log /var/log/nginx/error.log warn;   # symlinked to stderr in the official image
pid       /var/run/nginx.pid;

events {
    # Max simultaneous connections PER WORKER (client side + upstream side both count).
    worker_connections 4096;
}

http {
    default_type application/json;

    # JSON access log: one line per request, showing WHICH backend served it
    # ($upstream_addr) and how long it took. Retries show up as "ip1, ip2".
    log_format lb_json escape=json
        '{"time":"$time_iso8601",'
        '"client":"$remote_addr",'
        '"request":"$request_method $request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log lb_json;   # symlinked to stdout -> `docker compose logs nginx`

    sendfile          on;
    keepalive_timeout 65s;   # client <-> nginx keep-alive

    # Docker's embedded DNS server. Re-resolve upstream hostnames every 5s so
    # Nginx notices when api containers are stopped/started (`resolve` param).
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Must be LONGER than the DNS server takes to answer "no such name" (NXDOMAIN).
    # On Docker Desktop, a lookup for a STOPPED container is forwarded to the host's
    # DNS and takes ~4s. With a 2s timeout Nginx treats it as a temporary DNS failure
    # and keeps sending traffic to the dead container's old IP (measured in this lab).
    resolver_timeout 10s;

    include /etc/nginx/conf.d/*.conf;
}
